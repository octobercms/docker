; October CMS PHP Configuration

[PHP]
; Error handling - controlled by APP_DEBUG environment
display_errors = ${APP_DEBUG:-Off}
display_startup_errors = ${APP_DEBUG:-Off}
log_errors = On
error_log = /var/www/html/storage/logs/php_errors.log
error_reporting = E_ALL

; Memory and execution limits
memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; Upload limits
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 20

; Session
session.save_handler = files
session.save_path = /var/www/html/storage/framework/sessions
session.gc_maxlifetime = 1440

; Timezone
date.timezone = UTC

; Security
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

[opcache]
; OPcache is enabled/configured based on environment
opcache.enable = ${OPCACHE_ENABLE:-1}
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = ${OPCACHE_REVALIDATE_FREQ:-2}
opcache.validate_timestamps = ${OPCACHE_VALIDATE_TIMESTAMPS:-1}
opcache.save_comments = 1

[xdebug]
; Xdebug configuration (only active when extension is loaded)
xdebug.mode = ${XDEBUG_MODE:-off}
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.discover_client_host = true
xdebug.idekey = VSCODE
