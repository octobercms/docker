# October CMS Web-Only Configuration
#
# This configuration runs only the web server, connecting to:
# - External MySQL database (or data.yml container)
# - External Redis server (optional)
#
# Use this when you have a separate database server, managed database service,
# or are using data.yml for a multi-container setup.
#
# Usage:
#   1. Copy this file to containers/web.yml
#   2. Configure your external database credentials
#   3. Run: ./launcher bootstrap web
#   4. Access your site at the configured APP_URL

templates:
  - "templates/web.template.yml"
  # - "templates/scheduler.template.yml"    # Uncomment if you need cron
  # - "templates/queue.template.yml"        # Uncomment for queue workers
  # - "templates/web.ssl.template.yml"      # Uncomment for SSL
  # - "templates/web.letsencrypt.template.yml"

## Container port mappings
expose:
  - "80:80"
  # - "443:443"   # Uncomment for SSL

## Persistent data volumes
volumes:
  - volume:
      host: /var/october/shared/{{ config }}
      guest: /shared
  - volume:
      host: /var/october/shared/{{ config }}/logs
      guest: /var/log/october
  - volume:
      host: /var/october/shared/{{ config }}/uploads
      guest: /var/www/october/storage/app/uploads
  - volume:
      host: /var/october/shared/{{ config }}/media
      guest: /var/www/october/storage/app/media
  - volume:
      host: /var/october/shared/{{ config }}/themes
      guest: /var/www/october/themes
  - volume:
      host: /var/october/shared/{{ config }}/plugins
      guest: /var/www/october/plugins

params:
  ## PHP settings
  php_memory_limit: 256M
  upload_max_filesize: 50M

env:
  ## Application settings
  APP_KEY: "base64:CHANGE_THIS_APP_KEY"
  APP_NAME: "October CMS"
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: "http://october.example.com"
  APP_TIMEZONE: "UTC"
  APP_LOCALE: "en"

  ## External database configuration
  ## REQUIRED: Update these with your database server details
  ## If using data.yml, use the data container's IP or hostname
  DB_CONNECTION: mysql
  DB_HOST: "your-database-server.example.com"
  DB_PORT: "3306"
  DB_DATABASE: "october"
  DB_USERNAME: "october"
  DB_PASSWORD: "your-secure-password"

  ## External Redis configuration (optional)
  ## Uncomment and configure if using external Redis
  # REDIS_HOST: "your-redis-server.example.com"
  # REDIS_PORT: "6379"
  # REDIS_PASSWORD: "your-redis-password"
  # CACHE_DRIVER: redis
  # SESSION_DRIVER: redis
  # QUEUE_CONNECTION: redis

  ## Or use file-based caching (simpler, no Redis needed)
  CACHE_DRIVER: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: sync

  ## Logging
  LOG_CHANNEL: stack
  LOG_LEVEL: warning

  ## Let's Encrypt (uncomment SSL templates above to use)
  # LETSENCRYPT_EMAIL: "admin@example.com"

## Custom hooks for plugins, themes, etc.
