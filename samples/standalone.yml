# October CMS Standalone Configuration
#
# This is a complete all-in-one configuration that includes:
# - MySQL database
# - Redis for caching/sessions/queues
# - Apache web server with PHP 8.3
# - October CMS application
#
# Usage:
#   1. Copy this file to containers/app.yml
#   2. Edit the configuration below (especially APP_KEY, passwords, and domain)
#   3. Run: ./launcher bootstrap app
#   4. Access your site at the configured APP_URL
#
# For YAML syntax help: https://yaml-multiline.info/

templates:
  - "templates/mysql.template.yml"
  - "templates/redis.template.yml"
  - "templates/web.template.yml"
  # Uncomment for SSL support:
  # - "templates/web.ssl.template.yml"
  # - "templates/web.letsencrypt.template.yml"
  # Uncomment for background jobs:
  # - "templates/scheduler.template.yml"
  # - "templates/queue.template.yml"

## Container port mappings
expose:
  - "80:80"
  # - "443:443"

## Persistent data volumes
volumes:
  - volume:
      host: /var/october/shared/{{ config }}
      guest: /shared
  - volume:
      host: /var/october/shared/{{ config }}/logs
      guest: /var/log/october
  - volume:
      host: /var/october/shared/{{ config }}/uploads
      guest: /var/www/october/storage/app/uploads
  - volume:
      host: /var/october/shared/{{ config }}/media
      guest: /var/www/october/storage/app/media
  - volume:
      host: /var/october/shared/{{ config }}/themes
      guest: /var/www/october/themes
  - volume:
      host: /var/october/shared/{{ config }}/plugins
      guest: /var/www/october/plugins
  - volume:
      host: /var/october/shared/{{ config }}/mysql
      guest: /shared/mysql
  - volume:
      host: /var/october/shared/{{ config }}/redis
      guest: /shared/redis

## Template parameters
params:
  ## Database settings
  db_name: october
  db_user: october
  db_password: "CHANGE_THIS_DB_PASSWORD"
  db_innodb_buffer_pool_size: "256M"

  ## Redis settings
  redis_maxmemory: "128mb"

  ## PHP settings
  php_memory_limit: 256M
  upload_max_filesize: 50M

## Environment variables
## These are passed to the container and used to generate .env
env:
  ## Application settings
  ## IMPORTANT: Generate a new APP_KEY with: php artisan key:generate --show
  APP_KEY: "base64:CHANGE_THIS_APP_KEY"
  APP_NAME: "October CMS"
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: "http://october.example.com"
  APP_TIMEZONE: "UTC"
  APP_LOCALE: "en"

  ## Database connection (matches params above)
  DB_CONNECTION: mysql
  DB_HOST: "127.0.0.1"
  DB_PORT: "3306"
  DB_DATABASE: "october"
  DB_USERNAME: "october"
  DB_PASSWORD: "CHANGE_THIS_DB_PASSWORD"

  ## Cache, sessions, and queues
  CACHE_DRIVER: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis

  ## Redis connection
  REDIS_HOST: "127.0.0.1"
  REDIS_PORT: "6379"

  ## Logging
  LOG_CHANNEL: stack
  LOG_LEVEL: warning

  ## Let's Encrypt (uncomment SSL templates above to use)
  # LETSENCRYPT_EMAIL: "admin@example.com"

## Custom hooks for plugins, themes, etc.
