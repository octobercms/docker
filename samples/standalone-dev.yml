# October CMS Development Configuration
#
# This configuration is optimized for local development with:
# - Xdebug enabled for step debugging
# - Development PHP settings (display errors, no opcache validation)
# - MySQL and Redis included
# - Source code can be mounted from host for live editing
#
# Usage:
#   1. Copy this file to containers/app.yml
#   2. Run: ./launcher bootstrap app
#   3. Access your site at http://localhost
#   4. Connect your IDE to Xdebug on port 9003

templates:
  - "templates/mysql.template.yml"
  - "templates/redis.template.yml"
  - "templates/web.template.yml"
  # Queue workers for background jobs:
  # - "templates/queue.template.yml"

## Use the development base image (includes Xdebug)
base_image: octobercms/dev:1.0

## Container port mappings
expose:
  - "80:80"
  - "9003:9003"   # Xdebug

## Persistent data volumes
volumes:
  - volume:
      host: /var/october/shared/{{ config }}
      guest: /shared
  - volume:
      host: /var/october/shared/{{ config }}/logs
      guest: /var/log/october
  - volume:
      host: /var/october/shared/{{ config }}/uploads
      guest: /var/www/october/storage/app/uploads
  - volume:
      host: /var/october/shared/{{ config }}/media
      guest: /var/www/october/storage/app/media
  - volume:
      host: /var/october/shared/{{ config }}/themes
      guest: /var/www/october/themes
  - volume:
      host: /var/october/shared/{{ config }}/plugins
      guest: /var/www/october/plugins
  - volume:
      host: /var/october/shared/{{ config }}/mysql
      guest: /shared/mysql
  - volume:
      host: /var/october/shared/{{ config }}/redis
      guest: /shared/redis
  # Mount your local October CMS source for live editing
  # Uncomment and adjust path (overrides individual mounts above):
  # - volume:
  #     host: /path/to/your/october-cms
  #     guest: /var/www/october

params:
  ## Development PHP settings
  php_memory_limit: 512M
  upload_max_filesize: 100M

  ## Database
  db_name: october_dev
  db_user: october
  db_password: "development"
  db_innodb_buffer_pool_size: "256M"

  ## Redis settings
  redis_maxmemory: "128mb"

  ## Queue workers (if queue template enabled)
  queue_workers: 1

env:
  ## Development settings
  APP_KEY: "base64:CHANGE_THIS_APP_KEY"
  APP_NAME: "October CMS (Dev)"
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: "http://localhost"
  APP_TIMEZONE: "UTC"
  APP_LOCALE: "en"

  ## Database connection
  DB_CONNECTION: mysql
  DB_HOST: "127.0.0.1"
  DB_PORT: "3306"
  DB_DATABASE: "october_dev"
  DB_USERNAME: "october"
  DB_PASSWORD: "development"

  ## Cache, sessions, and queues
  CACHE_DRIVER: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis

  ## Redis connection
  REDIS_HOST: "127.0.0.1"
  REDIS_PORT: "6379"

  ## Xdebug
  XDEBUG_MODE: "debug,develop,coverage"
  XDEBUG_CONFIG: "client_host=host.docker.internal"

  ## Logging - show everything in development
  LOG_CHANNEL: stack
  LOG_LEVEL: debug

## Custom hooks for plugins, themes, etc.
# hooks:
#   after_migrate:
#     - exec:
#         cd: /var/www/october
#         cmd:
#           - sudo -u october composer require rainlab/blog-plugin
#           - sudo -u october composer require rainlab/user-plugin

run:
  ## Disable opcache validation caching for development
  - file:
      path: /usr/local/etc/php/conf.d/99-dev-opcache.ini
      contents: |
        opcache.validate_timestamps = 1
        opcache.revalidate_freq = 0
        opcache.jit = off
