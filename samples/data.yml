# October CMS Data Container Configuration
#
# This configuration runs only the data services:
# - MySQL database server
# - Redis server
#
# Use this with web-only.yml for a multi-container setup.
# This allows you to rebuild the web container without affecting the database.
#
# Usage:
#   1. Copy this file to containers/data.yml
#   2. Run: ./launcher bootstrap data
#   3. Configure web-only.yml to connect to this container
#   4. Run: ./launcher bootstrap web

templates:
  - "templates/mysql.template.yml"
  - "templates/redis.template.yml"

## Expose database ports (for web container to connect)
## Note: In production, consider using Docker networks instead of exposed ports
expose:
  - "3306:3306"   # MySQL
  - "6379:6379"   # Redis

## Persistent data volumes
volumes:
  - volume:
      host: /var/october/shared/{{ config }}/mysql
      guest: /shared/mysql
  - volume:
      host: /var/october/shared/{{ config }}/redis
      guest: /shared/redis
  - volume:
      host: /var/october/shared/{{ config }}/logs
      guest: /var/log

params:
  ## Database settings
  ## Note: MariaDB uses socket auth for root, no password needed
  db_name: october
  db_user: october
  db_password: "CHANGE_THIS_DB_PASSWORD"
  db_innodb_buffer_pool_size: "512M"
  db_max_connections: 200

  ## Redis settings
  redis_maxmemory: "256mb"
  redis_maxmemory_policy: "allkeys-lru"

env:
  ## These are used internally by the data container
  DB_DATABASE: october
  DB_USERNAME: october
  DB_PASSWORD: "CHANGE_THIS_DB_PASSWORD"

run:
  ## Allow remote connections to MySQL
  - exec:
      cmd:
        - |
          cat >> /etc/mysql/conf.d/october.cnf <<'MYSQLEOF'
          # Allow remote connections
          bind-address = 0.0.0.0
          MYSQLEOF

  ## Allow remote connections to Redis
  - replace:
      filename: /etc/redis/redis-october.conf
      from: "bind 127.0.0.1"
      to: "bind 0.0.0.0"

  ## Create database user with remote access
  - file:
      path: /etc/boot.d/02-mysql-remote
      chmod: "+x"
      contents: |
        #!/bin/bash

        # Wait for MySQL to start
        max_tries=30
        tries=0
        while [ $tries -lt $max_tries ]; do
          if mariadb-admin ping --silent 2>/dev/null; then
            break
          fi
          tries=$((tries + 1))
          sleep 1
        done

        # Allow remote connections for the october user
        mariadb -u root <<SQLEOF
        CREATE USER IF NOT EXISTS 'october'@'%' IDENTIFIED BY '$DB_PASSWORD';
        GRANT ALL PRIVILEGES ON october.* TO 'october'@'%';
        FLUSH PRIVILEGES;
        SQLEOF

        echo "MySQL remote access configured"
