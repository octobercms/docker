# Redis Template for October Docker
# Provides Redis for caching, sessions, and queues

params:
  redis_maxmemory: "128mb"
  redis_maxmemory_policy: "allkeys-lru"
  redis_datadir: /shared/redis

env:
  REDIS_HOST: "127.0.0.1"
  REDIS_PORT: 6379
  REDIS_PASSWORD: ""
  CACHE_DRIVER: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis

run:
  # Install Redis
  - exec:
      cmd:
        - apt-get update
        - apt-get install -y redis-server
        - rm -rf /var/lib/apt/lists/*

  # Create Redis configuration
  - file:
      path: /etc/redis/redis-october.conf
      contents: |
        # Redis configuration for October CMS

        # Network
        bind 127.0.0.1
        port 6379
        protected-mode yes

        # General
        daemonize no
        supervised no
        pidfile /var/run/redis/redis-server.pid
        loglevel notice
        logfile /var/log/redis/redis-server.log

        # Persistence
        dir $redis_datadir
        dbfilename dump.rdb
        save 900 1
        save 300 10
        save 60 10000
        stop-writes-on-bgsave-error yes
        rdbcompression yes
        rdbchecksum yes

        # Memory management
        maxmemory $redis_maxmemory
        maxmemory-policy $redis_maxmemory_policy

        # Append only file
        appendonly yes
        appendfilename "appendonly.aof"
        appendfsync everysec
        no-appendfsync-on-rewrite no
        auto-aof-rewrite-percentage 100
        auto-aof-rewrite-min-size 64mb

        # Slow log
        slowlog-log-slower-than 10000
        slowlog-max-len 128

        # Latency monitor
        latency-monitor-threshold 0

        # TCP keepalive
        tcp-keepalive 300

  # Create directories
  - exec:
      cmd:
        - mkdir -p $redis_datadir
        - mkdir -p /var/log/redis
        - mkdir -p /var/run/redis
        - chown -R redis:redis $redis_datadir /var/log/redis /var/run/redis

  # Create supervisor config for Redis
  - file:
      path: /etc/supervisor/conf.d/redis.conf
      contents: |
        [program:redis]
        command=/usr/bin/redis-server /etc/redis/redis-october.conf
        autostart=true
        autorestart=true
        user=redis
        priority=20
        startretries=5
        startsecs=5
        stdout_logfile=/var/log/supervisor/redis-stdout.log
        stderr_logfile=/var/log/supervisor/redis-stderr.log

  # Create health check script
  - file:
      path: /usr/local/bin/redis-health
      chmod: "+x"
      contents: |
        #!/bin/bash
        redis-cli ping | grep -q PONG
