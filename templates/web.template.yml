# Web Template for October Docker
# Core web server and October CMS application setup

base_image: octobercms/base:1.0

params:
  home: /var/www/october

  # PHP settings
  php_memory_limit: 256M
  php_max_execution_time: 300
  upload_max_filesize: 50M
  post_max_size: 50M

  # Performance
  opcache_memory: 256
  opcache_max_files: 20000

env:
  APP_NAME: "October CMS"
  APP_ENV: production
  APP_DEBUG: false
  APP_URL: "http://localhost"
  APP_TIMEZONE: UTC
  APP_LOCALE: en

  # Logging
  LOG_CHANNEL: stack

  # Default to file drivers (overridden by redis template if included)
  CACHE_DRIVER: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: sync

volumes:
  - volume:
      host: /var/october/shared/{{ config }}
      guest: /shared
  - volume:
      host: /var/october/shared/{{ config }}/logs
      guest: /var/log/october

expose:
  - "80:80"

run:
  # PHP Configuration
  - file:
      path: /usr/local/etc/php/conf.d/99-october-web.ini
      contents: |
        ; October CMS Web Configuration
        memory_limit = $php_memory_limit
        upload_max_filesize = $upload_max_filesize
        post_max_size = $post_max_size
        max_execution_time = $php_max_execution_time
        max_input_time = $php_max_execution_time
        max_input_vars = 5000

        ; Security
        expose_php = Off
        display_errors = Off
        log_errors = On
        error_log = /var/log/october/php-error.log

        ; Session
        session.cookie_httponly = 1
        session.use_strict_mode = 1
        session.cookie_samesite = Lax

        ; Performance
        realpath_cache_size = 4096K
        realpath_cache_ttl = 600

  # OPcache configuration
  - file:
      path: /usr/local/etc/php/conf.d/99-october-opcache.ini
      contents: |
        opcache.enable = 1
        opcache.memory_consumption = $opcache_memory
        opcache.interned_strings_buffer = 16
        opcache.max_accelerated_files = $opcache_max_files
        opcache.validate_timestamps = 0
        opcache.save_comments = 1
        opcache.fast_shutdown = 1
        opcache.enable_cli = 0
        opcache.jit = tracing
        opcache.jit_buffer_size = 128M

  # Apache configuration
  - file:
      path: /etc/apache2/sites-available/october.conf
      contents: |
        <VirtualHost *:80>
            ServerAdmin webmaster@localhost
            DocumentRoot $home/public

            <Directory $home/public>
                Options -Indexes +FollowSymLinks
                AllowOverride All
                Require all granted

                # Handle Authorization Header
                RewriteEngine On
                RewriteCond %{HTTP:Authorization} ^(.*)
                RewriteRule .* - [e=HTTP_AUTHORIZATION:%1]
            </Directory>

            # Deny access to sensitive files
            <FilesMatch "^\.">
                Require all denied
            </FilesMatch>

            # Logging
            ErrorLog /var/log/apache2/october-error.log
            CustomLog /var/log/apache2/october-access.log combined

            # Security headers
            Header always set X-Content-Type-Options "nosniff"
            Header always set X-Frame-Options "SAMEORIGIN"
            Header always set X-XSS-Protection "1; mode=block"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"

            # Caching for static assets
            <FilesMatch "\.(ico|pdf|flv|jpg|jpeg|png|gif|webp|avif|js|css|swf|svg|woff|woff2|ttf|eot)$">
                Header set Cache-Control "max-age=31536000, public"
            </FilesMatch>
        </VirtualHost>

  - exec:
      cmd:
        - a2ensite october
        - a2dissite 000-default || true

  # Create required directories
  - exec:
      cd: $home
      cmd:
        - mkdir -p storage/app/public storage/app/media
        - mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views
        - mkdir -p storage/logs storage/temp
        - mkdir -p bootstrap/cache
        - mkdir -p plugins themes modules

  # Create public directory with symlinks
  - exec:
      cd: $home
      cmd:
        - sudo -u october php artisan october:mirror public --relative

  # Symlink persistent storage to shared volume
  - exec:
      cd: $home
      cmd:
        - |
          # Link uploads to shared storage for persistence
          if [ -d "/shared/uploads" ]; then
            ln -sfn /shared/uploads storage/app/uploads
          fi
          # Link plugins to shared storage for persistence
          if [ -d "/shared/plugins" ]; then
            ln -sfn /shared/plugins plugins
          fi
          # Link themes to shared storage for persistence
          if [ -d "/shared/themes" ]; then
            ln -sfn /shared/themes themes
          fi

  # Set permissions
  - exec:
      cd: $home
      cmd:
        - chown -R october:www-data .
        - find . -type f -exec chmod 644 {} \;
        - find . -type d -exec chmod 755 {} \;
        - chmod -R 775 storage bootstrap/cache
        - chmod +x artisan 2>/dev/null || true

  # Create migration boot script (runs after MySQL is started by supervisor)
  - file:
      path: /etc/boot.d/10-october-migrate
      chmod: "+x"
      contents: |
        #!/bin/bash
        echo "[10-october-migrate] Starting migration script..."
        cd /var/www/october
        echo "[10-october-migrate] Current directory: $(pwd)"
        echo "[10-october-migrate] Checking for .env file..."
        if [ -f .env ]; then
          echo "[10-october-migrate] .env found, running migrations..."
          sudo -u october php artisan october:migrate 2>&1
          echo "[10-october-migrate] Migration exit code: $?"
        else
          echo "[10-october-migrate] No .env file found, skipping migrations"
        fi
        echo "[10-october-migrate] Migration script complete"

  # Create optimization boot script (runs after migrations)
  - file:
      path: /etc/boot.d/20-october-optimize
      chmod: "+x"
      contents: |
        #!/bin/bash
        cd /var/www/october
        if [ "$APP_ENV" = "production" ]; then
          echo "Optimizing for production..."
          sudo -u october php artisan config:cache || true
          sudo -u october php artisan route:cache || true
          sudo -u october php artisan view:cache || true
        fi

  # Create convenience scripts
  - file:
      path: /usr/local/bin/october-update
      chmod: "+x"
      contents: |
        #!/bin/bash
        cd /var/www/october
        sudo -u october composer update --no-dev --optimize-autoloader
        sudo -u october php artisan cache:clear
        sudo -u october php artisan october:migrate
        sudo -u october php artisan october:optimize
        echo "October CMS updated successfully!"

  - file:
      path: /usr/local/bin/october-clear
      chmod: "+x"
      contents: |
        #!/bin/bash
        cd /var/www/october
        sudo -u october php artisan cache:clear
        sudo -u october php artisan config:clear
        sudo -u october php artisan route:clear
        sudo -u october php artisan view:clear
        echo "All caches cleared!"
