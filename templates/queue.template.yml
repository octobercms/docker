# Queue Worker Template for October Docker
# Runs Laravel queue workers for background job processing

params:
  queue_workers: 2
  queue_connection: redis
  queue_name: default
  queue_tries: 3
  queue_timeout: 90
  queue_sleep: 3
  queue_max_jobs: 1000
  queue_max_time: 3600

env:
  QUEUE_CONNECTION: $queue_connection

run:
  # Create supervisor config for queue workers
  - file:
      path: /etc/supervisor/conf.d/queue-worker.conf
      contents: |
        [program:queue-worker]
        process_name=%(program_name)s_%(process_num)02d
        command=php /var/www/october/artisan queue:work $queue_connection --queue=$queue_name --sleep=$queue_sleep --tries=$queue_tries --timeout=$queue_timeout --max-jobs=$queue_max_jobs --max-time=$queue_max_time
        autostart=true
        autorestart=true
        user=october
        numprocs=$queue_workers
        redirect_stderr=true
        stdout_logfile=/var/log/october/queue-worker.log
        stdout_logfile_maxbytes=10MB
        stdout_logfile_backups=3
        stopwaitsecs=$queue_timeout
        stopsignal=SIGTERM
        priority=200

  # Create log file
  - exec:
      cmd:
        - touch /var/log/october/queue-worker.log
        - chown october:www-data /var/log/october/queue-worker.log

  # Create helper scripts for queue management
  - file:
      path: /usr/local/bin/october-queue-restart
      chmod: "+x"
      contents: |
        #!/bin/bash
        echo "Restarting queue workers..."
        cd /var/www/october
        sudo -u october php artisan queue:restart
        supervisorctl restart queue-worker:*
        echo "Queue workers restarted"

  - file:
      path: /usr/local/bin/october-queue-status
      chmod: "+x"
      contents: |
        #!/bin/bash
        echo "=== Queue Worker Status ==="
        supervisorctl status queue-worker:*
        echo ""
        echo "=== Failed Jobs ==="
        cd /var/www/october
        sudo -u october php artisan queue:failed

  - file:
      path: /usr/local/bin/october-queue-retry
      chmod: "+x"
      contents: |
        #!/bin/bash
        echo "Retrying all failed jobs..."
        cd /var/www/october
        sudo -u october php artisan queue:retry all
        echo "Done"

  - file:
      path: /usr/local/bin/october-queue-clear
      chmod: "+x"
      contents: |
        #!/bin/bash
        echo "Clearing failed jobs..."
        cd /var/www/october
        sudo -u october php artisan queue:flush
        echo "Done"

  - file:
      path: /usr/local/bin/october-queue-log
      chmod: "+x"
      contents: |
        #!/bin/bash
        tail -f /var/log/october/queue-worker.log
