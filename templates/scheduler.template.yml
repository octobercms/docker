# Laravel Scheduler Template for October Docker
# Runs the Laravel/October scheduler via cron

run:
  # Create cron job for Laravel scheduler
  - file:
      path: /etc/cron.d/october-scheduler
      contents: |
        SHELL=/bin/bash
        PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin

        # Run Laravel scheduler every minute
        * * * * * october cd /var/www/october && php artisan schedule:run >> /var/log/october/scheduler.log 2>&1

  # Set correct permissions on cron file
  - exec:
      cmd:
        - chmod 644 /etc/cron.d/october-scheduler
        - touch /var/log/october/scheduler.log
        - chown october:www-data /var/log/october/scheduler.log

  # Create supervisor config for cron daemon
  - file:
      path: /etc/supervisor/conf.d/cron.conf
      contents: |
        [program:cron]
        command=/usr/sbin/cron -f
        autostart=true
        autorestart=true
        priority=50
        stdout_logfile=/var/log/supervisor/cron-stdout.log
        stderr_logfile=/var/log/supervisor/cron-stderr.log

  # Create helper script to view scheduler output
  - file:
      path: /usr/local/bin/october-scheduler-log
      chmod: "+x"
      contents: |
        #!/bin/bash
        tail -f /var/log/october/scheduler.log
