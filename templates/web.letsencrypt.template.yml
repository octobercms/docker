# Let's Encrypt Template for October Docker
# Automatic SSL certificate management with certbot

params:
  letsencrypt_email: ""
  ssl_cert_path: /etc/letsencrypt/live/${APP_HOSTNAME}/fullchain.pem
  ssl_key_path: /etc/letsencrypt/live/${APP_HOSTNAME}/privkey.pem
  ssl_chain_path: /etc/letsencrypt/live/${APP_HOSTNAME}/chain.pem

env:
  LETSENCRYPT_EMAIL: $letsencrypt_email

run:
  # Install certbot
  - exec:
      cmd:
        - apt-get update
        - apt-get install -y certbot python3-certbot-apache
        - rm -rf /var/lib/apt/lists/*

  # Create directories
  - exec:
      cmd:
        - mkdir -p /etc/letsencrypt
        - mkdir -p /var/www/october/public/.well-known/acme-challenge
        - chown -R october:www-data /var/www/october/public/.well-known

  # Create certificate request script
  - file:
      path: /usr/local/bin/october-ssl-init
      chmod: "+x"
      contents: |
        #!/bin/bash
        set -e

        HOSTNAME="${APP_HOSTNAME:-localhost}"
        EMAIL="${LETSENCRYPT_EMAIL:-admin@$HOSTNAME}"

        if [ "$HOSTNAME" = "localhost" ]; then
          echo "Cannot get Let's Encrypt certificate for localhost"
          exit 1
        fi

        echo "Requesting SSL certificate for: $HOSTNAME"
        echo "Email: $EMAIL"

        # Request certificate using webroot method
        certbot certonly \
          --webroot \
          --webroot-path /var/www/october/public \
          --email "$EMAIL" \
          --agree-tos \
          --no-eff-email \
          --non-interactive \
          -d "$HOSTNAME"

        # Update Apache SSL config to use Let's Encrypt certs
        if [ -f /etc/letsencrypt/live/$HOSTNAME/fullchain.pem ]; then
          echo "Certificate obtained successfully!"

          # Update Apache SSL config
          sed -i "s|SSLCertificateFile.*|SSLCertificateFile /etc/letsencrypt/live/$HOSTNAME/fullchain.pem|" /etc/apache2/sites-available/october-ssl.conf
          sed -i "s|SSLCertificateKeyFile.*|SSLCertificateKeyFile /etc/letsencrypt/live/$HOSTNAME/privkey.pem|" /etc/apache2/sites-available/october-ssl.conf
          sed -i "s|SSLCertificateChainFile.*|SSLCertificateChainFile /etc/letsencrypt/live/$HOSTNAME/chain.pem|" /etc/apache2/sites-available/october-ssl.conf

          # Reload Apache
          apache2ctl graceful

          echo "SSL configured and Apache reloaded!"
        else
          echo "Failed to obtain certificate"
          exit 1
        fi

  # Create certificate renewal script
  - file:
      path: /usr/local/bin/october-ssl-renew
      chmod: "+x"
      contents: |
        #!/bin/bash
        echo "Renewing SSL certificates..."
        certbot renew --quiet --post-hook "apache2ctl graceful"
        echo "Done"

  # Create cron job for automatic renewal
  - file:
      path: /etc/cron.d/certbot-renew
      contents: |
        SHELL=/bin/bash
        PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin

        # Check for certificate renewal twice daily
        0 0,12 * * * root certbot renew --quiet --post-hook "apache2ctl graceful"

  - exec:
      cmd:
        - chmod 644 /etc/cron.d/certbot-renew

  # Create boot script to request certificate on first run
  - file:
      path: /etc/boot.d/99-letsencrypt
      chmod: "+x"
      contents: |
        #!/bin/bash

        HOSTNAME="${APP_HOSTNAME:-localhost}"

        # Skip if localhost
        if [ "$HOSTNAME" = "localhost" ]; then
          echo "Skipping Let's Encrypt for localhost"
          exit 0
        fi

        # Check if certificate already exists
        if [ -f "/etc/letsencrypt/live/$HOSTNAME/fullchain.pem" ]; then
          echo "SSL certificate already exists for $HOSTNAME"
          exit 0
        fi

        # Wait for Apache to be ready
        sleep 5

        # Try to get certificate
        echo "Attempting to obtain Let's Encrypt certificate..."
        /usr/local/bin/october-ssl-init || {
          echo "WARNING: Could not obtain Let's Encrypt certificate"
          echo "You can run '/usr/local/bin/october-ssl-init' manually later"
          echo "Make sure your domain DNS points to this server"
        }
