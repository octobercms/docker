# SSL Template for October Docker
# Enables HTTPS with HTTP/2 support using custom or Let's Encrypt certificates

params:
  ssl_cert_path: /shared/ssl/cert.pem
  ssl_key_path: /shared/ssl/key.pem
  ssl_chain_path: /shared/ssl/chain.pem

expose:
  - "443:443"

run:
  # Enable SSL module
  - exec:
      cmd:
        - a2enmod ssl

  # Create SSL directories
  - exec:
      cmd:
        - mkdir -p /shared/ssl
        - mkdir -p /etc/apache2/ssl

  # Create SSL virtual host with HTTP/2
  - file:
      path: /etc/apache2/sites-available/october-ssl.conf
      contents: |
        <VirtualHost *:443>
            ServerAdmin webmaster@localhost
            DocumentRoot /var/www/october/public

            # Enable HTTP/2 over SSL
            Protocols h2 http/1.1

            # SSL Configuration
            SSLEngine on
            SSLCertificateFile $ssl_cert_path
            SSLCertificateKeyFile $ssl_key_path
            SSLCertificateChainFile $ssl_chain_path

            # Modern SSL configuration
            SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
            SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
            SSLHonorCipherOrder off
            SSLSessionTickets off

            # HSTS Header
            Header always set Strict-Transport-Security "max-age=63072000"

            # Proxy PHP requests to PHP-FPM
            <FilesMatch \.php$>
                SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost"
            </FilesMatch>

            <Directory /var/www/october/public>
                Options -Indexes +FollowSymLinks
                AllowOverride All
                Require all granted

                RewriteEngine On
                RewriteCond %{HTTP:Authorization} ^(.*)
                RewriteRule .* - [e=HTTP_AUTHORIZATION:%1]
            </Directory>

            # Deny access to sensitive files
            <FilesMatch "^\.">
                Require all denied
            </FilesMatch>

            # Logging
            ErrorLog /var/log/apache2/october-ssl-error.log
            CustomLog /var/log/apache2/october-ssl-access.log combined

            # Security headers
            Header always set X-Content-Type-Options "nosniff"
            Header always set X-Frame-Options "SAMEORIGIN"
            Header always set X-XSS-Protection "1; mode=block"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set Content-Security-Policy "upgrade-insecure-requests"

            # Caching for static assets
            <FilesMatch "\.(ico|pdf|flv|jpg|jpeg|png|gif|webp|avif|js|css|swf|svg|woff|woff2|ttf|eot)$">
                Header set Cache-Control "max-age=31536000, public"
            </FilesMatch>
        </VirtualHost>

  # Enable SSL site
  - exec:
      cmd:
        - a2ensite october-ssl

  # Update HTTP to redirect to HTTPS
  - file:
      path: /etc/apache2/sites-available/october.conf
      contents: |
        <VirtualHost *:80>
            ServerAdmin webmaster@localhost
            DocumentRoot /var/www/october/public

            # Redirect all HTTP to HTTPS
            RewriteEngine On
            RewriteCond %{HTTPS} off
            RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

            # For Let's Encrypt challenge
            <Directory /var/www/october/public/.well-known>
                Require all granted
            </Directory>
        </VirtualHost>

  # Create well-known directory for ACME challenges
  - exec:
      cmd:
        - mkdir -p /var/www/october/public/.well-known/acme-challenge
        - chown -R october:www-data /var/www/october/public/.well-known